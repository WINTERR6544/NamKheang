<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ICEFLOW · Factory</title>
  <link rel="stylesheet" href="../admin/admin.css">
  <link rel="stylesheet" href="factory.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="gate" class="gate">
    <form id="gform" class="card">
      <h1>ICEFLOW</h1>
      <p class="muted">เข้าสู่ระบบโรงงาน (Factory Workspace)</p>
      <div style="margin:12px 0"><label>อีเมล</label><input id="gemail" type="email" required autocomplete="username"></div>
      <div style="margin:12px 0"><label>รหัสผ่าน</label><input id="gpass" type="password" required autocomplete="current-password"></div>
      <div id="gerr" class="err" hidden style="margin-bottom:12px"></div>
      <button class="btn" style="width:100%">เข้าสู่ระบบ</button>
    </form>
  </div>
  <div id="app" class="shell" hidden>
    <aside id="side"></aside>
    <div class="col">
      <header class="topbar">
        <div class="crumbs" id="crumbs"></div>
        <div class="me">
          <a class="bell" id="bell" href="#/requests" title="คำขอรอประเมิน" aria-label="คำขอรอประเมิน"><span class="dot" id="belld" hidden></span></a>
          <span class="sep"></span>
          <span class="avatar" id="av"></span><b id="mename"></b>
          <button class="menu-btn" id="logout" title="ออกจากระบบ" aria-label="ออกจากระบบ"></button>
        </div>
      </header>
      <main id="view"></main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/core.js"></script>
  <script src="js/lib.js"></script>
  <script>boot();</script>
</body>
</html>
