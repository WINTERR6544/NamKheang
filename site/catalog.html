<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เลือกรุ่นเครื่อง · ICEFLOW</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <main style="max-width:1080px">
    <span class="eyebrow">STEP 1 / 2 · เลือกรุ่น</span>
    <h1>แคตตาล็อกเครื่องทำน้ำแข็ง</h1>
    <p class="muted" style="margin-bottom:20px">เลือกรุ่นที่ใช่ ขั้นต่อไปกรอกสถานที่ติดตั้งและรายละเอียดเพิ่มเติม</p>
    <div id="chips" class="inline" style="margin-bottom:24px"></div>
    <div id="grid" class="catalog"><p class="muted">กำลังโหลด...</p></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="app.js"></script>
  <script>
    // Step 1 of ordering: pick a model, then new-order.html?model=<id> collects the rest
    let models = [], filter = "ทั้งหมด";

    (async () => {
      if (!(await requireSession())) return;
      const { data, error } = await db.from("machine_models")
        .select("model_id, code, name, machine_type, capacity, price, description").order("price");
      if (error) return ($("#grid").innerHTML = `<div class="err">${esc(errText(error))}</div>`);
      models = data;
      draw();
    })();

    function draw() {
      const types = ["ทั้งหมด", ...new Set(models.map((m) => m.machine_type))];
      $("#chips").innerHTML = types.map((t) =>
        `<button class="btn ${t === filter ? "" : "ghost"}" data-t="${esc(t)}" aria-pressed="${t === filter}">${esc(t)}</button>`).join("");
      $("#chips").querySelectorAll("button").forEach((b) => (b.onclick = () => { filter = b.dataset.t; draw(); }));

      const list = models.filter((m) => filter === "ทั้งหมด" || m.machine_type === filter);
      $("#grid").innerHTML = list.length ? list.map((m) => `
        <article class="model">
          <div class="row"><span class="stamp" style="transform:rotate(-4deg)">${esc(m.code)}</span><span class="small muted">${esc(m.machine_type)}</span></div>
          <h2 style="margin-top:14px">${esc(m.name)}</h2>
          <div class="li"><span>กำลังผลิต</span><i></i><b>${esc(m.capacity)}</b></div>
          <p class="small" style="margin:10px 0 14px">${esc(m.description ?? "")}</p>
          <div class="price">${baht(m.price)}</div>
          <div class="small muted" style="margin-bottom:14px">ราคาก่อน VAT 7%</div>
          <a class="btn block" href="new-order.html?model=${m.model_id}">เลือกรุ่นนี้ →</a>
        </article>`).join("") : `<div class="card">ไม่พบรุ่นในหมวดนี้</div>`;
    }
  </script>
</body>
</html>
