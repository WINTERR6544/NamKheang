<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order · ICEFLOW</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <main>
    <a href="orders.html" class="muted small" style="text-decoration:none">← My orders</a>
    <div id="app" class="stack" style="margin-top:12px"><p class="muted">Loading...</p></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="app.js"></script>
  <script>
    const ORDER_ID = Number(new URLSearchParams(location.search).get("id"));
    const app = $("#app");
    let d; // current order data

    (async () => { if (await requireSession()) load(); })();

    async function load() {
      const q = (t, cols) => db.from(t).select(cols).eq("order_id", ORDER_ID);
      const [o, logs, quote, pays, appt, notes] = await Promise.all([
        q("orders", "order_id, order_code, machine_type, capacity, install_address, install_power, install_space, status, est_finish_date, cancel_reason, created_at, machine_models(name, code)").maybeSingle(),
        q("order_status_logs", "status, changed_at").order("changed_at"),
        q("quotations", "quotation_id, subtotal, vat, total_price, deposit_amount, valid_until, status, quotation_items(description, amount)").order("created_at", { ascending: false }).limit(1).maybeSingle(),
        q("payments", "amount, pay_type, verified, receipt_no").order("paid_at"),
        q("appointments", "install_datetime, status").order("created_at", { ascending: false }).limit(1).maybeSingle(),
        q("notifications", "message, created_at").order("created_at", { ascending: false }).limit(8),
      ]);
      if (!o.data) return (app.innerHTML = `<div class="card">Order not found</div>`);
      d = { o: o.data, logs: logs.data ?? [], quote: quote.data, pays: pays.data ?? [], appt: appt.data, notes: notes.data ?? [] };
      render();
    }

    const info = (title, html) => `<div class="card info"><h2>${title}</h2><div class="small">${html}</div></div>`;
    const errBox = (el, t) => { el.textContent = t; el.hidden = !t; };

    function render() {
      const { o } = d;
      app.innerHTML = `
        <div class="card">
          <div class="row">
            <div><h1>${esc(o.order_code)}</h1><div class="muted">${o.machine_models ? esc(o.machine_models.name) + " · " : ""}${esc(o.machine_type)} · ${esc(o.capacity)}</div></div>
            <span class="${pillClass(o.status)}">${esc(STATUS_LABEL[o.status])}</span>
          </div>
          <dl class="kv">
            <div><dt>Install address</dt><dd>${esc(o.install_address)}</dd></div>
            <div><dt>Ordered</dt><dd>${dateTH(o.created_at, true)}</dd></div>
            ${o.install_power ? `<div><dt>Electrical supply</dt><dd>${esc(o.install_power)}</dd></div>` : ""}
            ${o.install_space ? `<div><dt>Install area</dt><dd>${esc(o.install_space)}</dd></div>` : ""}
          </dl>
          <hr style="border:0;border-top:2px dashed var(--ink);margin:16px 0 0">
          ${barcode(o.order_code)}<div class="bc-text">${esc(o.order_code)}</div>
        </div>
        <div id="actions" class="stack"></div>
        ${timeline()}
        ${d.notes.length ? `<div class="card"><h2>Notifications</h2><ul class="plain notes">${d.notes.map((n) =>
          `<li><span>${esc(n.message)}</span><span class="muted" style="flex:none">${dateTH(n.created_at, true)}</span></li>`).join("")}</ul></div>` : ""}
        <div id="demo"></div>`;
      actions();
      demo();
    }

    /* UC10: timeline */
    function timeline() {
      const { o, logs } = d, at = new Map();
      logs.forEach((l) => at.set(l.status, l.changed_at)); // last time each status was reached
      const steps = o.status === 99 ? [...at.keys()].sort((a, b) => (at.get(a) < at.get(b) ? -1 : 1)) : MAIN_PATH;
      return `<div class="card"><h2 style="margin-bottom:16px">Order status</h2><ol class="timeline">${steps.map((s) => {
        const cls = s === 99 ? "x done" : s === o.status ? "done cur" : at.has(s) ? "done" : "todo";
        return `<li class="${cls}"><span class="dot"></span><div><div>${s === o.status ? "<b>" : ""}${esc(STATUS_LABEL[s])}${s === o.status ? "</b>" : ""}</div>
          ${at.has(s) ? `<div class="muted small">${dateTH(at.get(s), true)}</div>` : ""}</div></li>`;
      }).join("")}</ol></div>`;
    }

    /* UC9 / UC7 / UC11: what the customer can do now */
    function actions() {
      const { o, quote: q, pays, appt } = d, box = $("#actions");
      const deposit = pays.find((p) => p.pay_type === "deposit");
      const final = pays.find((p) => p.pay_type === "final");
      const refund = pays.find((p) => p.pay_type === "refund");
      let html = "";

      if (o.status === 0) html = info("Waiting for the shop's quote", "The shop is reviewing your details and will send a quote soon. You'll get a notification.");
      else if (o.status === 1 && q) {
        html = `<div class="card stack"><h2>Quotation</h2>
          <table class="q">${q.quotation_items.map((i) => `<tr><td>${esc(i.description)}</td><td>${baht(i.amount)}</td></tr>`).join("")}
            <tr class="muted"><td>VAT 7%</td><td>${baht(q.vat)}</td></tr>
            <tr class="total"><td>Total</td><td>${baht(q.total_price)}</td></tr>
            <tr class="dep"><td>Deposit due</td><td>${baht(q.deposit_amount)}</td></tr></table>
          <div class="muted small">Quote valid until ${dateTH(q.valid_until)}</div>
          ${deposit ? `<div class="ok">Deposit slip sent. Waiting for the shop to verify it.</div>` : `<div id="pay"></div>`}</div>`;
      }
      else if (o.status === 2) html = info("Deposit paid", "The shop is sending your production order to the factory.");
      else if (o.status === 3) html = info("Waiting for the factory", "Your order was sent to the factory. If it declines, the shop will contact another one.");
      else if (o.status === 4) html = info("In production", `Expected to be finished by ${dateTH(o.est_finish_date)}`);
      else if (o.status === 5 || o.status === 6) html = info("Quality check", "Your machine is built and is being checked before the install date is set.");
      else if (o.status === 7) html = info("Quality check passed", "The shop is arranging an install date with you and the factory.");
      else if (o.status === 8) html = info("Installation scheduled", `Date: <b>${appt ? dateTH(appt.install_datetime, true) : "-"}</b> (the installation is done by the factory)`);
      else if (o.status === 9 && q) {
        html = final
          ? info("Waiting for payment check", `Slip for the remaining ${baht(final.amount)} sent. You'll get a receipt once the shop confirms.`)
          : `<div class="card stack"><h2>Accept the machine and pay the balance</h2>
              <div class="inline"><button class="btn" id="pass">Accept</button><button class="btn ghost" id="fail">Report a problem</button></div>
              <div id="accept"></div></div>`;
      }
      else if (o.status === 10) html = info("Completed 🎉", `Paid in full${final?.receipt_no ? ` · Receipt no. <b>${esc(final.receipt_no)}</b>` : ""}`);
      else if (o.status === 99) {
        html = info("Cancelled", `Reason: ${esc(o.cancel_reason || "-")}${refund ? `<br>Deposit refund ${baht(refund.amount)}: ${refund.verified ? "transferred back" : "waiting for the shop to transfer it"}` : ""}`);
      }
      if ([0, 1, 2, 3].includes(o.status)) html += `<div id="cancel"></div>`;
      box.innerHTML = html;

      if ($("#pay")) payForm($("#pay"), "Confirm the quote and send the deposit slip", "deposit",
        (m, slip) => db.rpc("customer_accept_quote", { p_order: ORDER_ID, p_method: m, p_slip: slip }));
      if ($("#accept")) acceptance(pays, q);
      if ($("#cancel")) cancelBox(!!deposit?.verified);
    }

    /* slip upload + payment method, shared by UC9 (deposit) and UC7 (final) */
    function payForm(el, label, prefix, call) {
      el.innerHTML = `<div class="stack">
        <div class="grid2">
          <div><label>Payment method</label><select class="m"><option value="transfer">Bank transfer</option><option value="qr">PromptPay QR</option><option value="cash">Cash (pay at the shop)</option></select></div>
          <div class="f"><label>Transfer slip</label><input class="file" type="file" accept="image/*"></div>
        </div>
        <div class="err" hidden></div><button class="btn go">${label}</button></div>`;
      const m = $(".m", el), f = $(".f", el), e = $(".err", el), btn = $(".go", el);
      m.onchange = () => (f.hidden = m.value === "cash");
      btn.onclick = async () => {
        const file = $(".file", el).files[0];
        if (m.value !== "cash" && !file) return errBox(e, "Please attach the transfer slip");
        btn.disabled = true; errBox(e, "");
        let path = null;
        if (file && m.value !== "cash") {
          const { data: u } = await db.auth.getUser();
          const ext = (file.name.split(".").pop() || "jpg").replace(/[^a-z0-9]/gi, "");
          path = `${u.user.id}/${ORDER_ID}-${prefix}-${Date.now()}.${ext}`;
          const up = await db.storage.from("payment-slips").upload(path, file);
          if (up.error) { btn.disabled = false; return errBox(e, errText(up.error)); }
        }
        const { error } = await call(m.value, path);
        btn.disabled = false;
        if (error) return errBox(e, errText(error));
        load();
      };
    }

    /* UC7: acceptance + final payment */
    function acceptance(pays, q) {
      const paid = pays.filter((p) => p.pay_type === "deposit" && p.verified).reduce((s, p) => s + Number(p.amount), 0);
      const el = $("#accept");
      const showPass = () => {
        el.innerHTML = `<div class="stack"><div class="small">Balance due <b>${baht(q.total_price - paid)}</b>
          <span class="muted">(total ${baht(q.total_price)} − deposit ${baht(paid)})</span></div><div id="fp"></div></div>`;
        payForm($("#fp"), "Accept and pay", "final",
          (m, slip) => db.rpc("customer_submit_acceptance", { p_order: ORDER_ID, p_passed: true, p_note: null, p_method: m, p_slip: slip }));
      };
      const showFail = () => {
        el.innerHTML = `<div class="stack"><div><label>What is wrong?</label><textarea rows="3"></textarea></div>
          <div class="err" hidden></div><button class="btn go">Report the problem and ask for a new date</button></div>`;
        $(".go", el).onclick = async () => {
          const note = $("textarea", el).value.trim();
          if (!note) return errBox($(".err", el), "Please describe the problem");
          const { error } = await db.rpc("customer_submit_acceptance", { p_order: ORDER_ID, p_passed: false, p_note: note, p_method: null, p_slip: null });
          if (error) return errBox($(".err", el), errText(error));
          load();
        };
      };
      const tab = (pass) => { $("#pass").className = "btn" + (pass ? "" : " ghost"); $("#fail").className = "btn" + (pass ? " ghost" : ""); pass ? showPass() : showFail(); };
      $("#pass").onclick = () => tab(true);
      $("#fail").onclick = () => tab(false);
      tab(true);
    }

    /* UC11: cancel */
    function cancelBox(hasDeposit) {
      const el = $("#cancel");
      el.innerHTML = `<button class="link-red">Cancel order</button>`;
      $("button", el).onclick = () => {
        el.innerHTML = `<div class="card danger stack"><h2 style="color:#8a1f14">Cancel order</h2>
          <div><label>Reason</label><textarea class="why" rows="2"></textarea></div>
          ${hasDeposit ? `<div><label>Account for the deposit refund</label><input class="acct" placeholder="Bank / account number / account name"></div>` : ""}
          <div class="err" hidden></div>
          <div class="inline"><button class="btn red go">Confirm cancel</button><button class="btn ghost no">Keep order</button></div></div>`;
        $(".no", el).onclick = () => cancelBox(hasDeposit);
        $(".go", el).onclick = async () => {
          const why = $(".why", el).value.trim(), acct = $(".acct", el)?.value.trim();
          const e = $(".err", el);
          if (!why) return errBox(e, "Please enter a reason");
          if (hasDeposit && !acct) return errBox(e, "Please enter the account for the deposit refund");
          const { error } = await db.rpc("customer_cancel_order", { p_order: ORDER_ID, p_reason: why, p_refund_account: acct || null });
          if (error) return errBox(e, errText(error));
          load();
        };
      };
    }

    /* demo only: stands in for the shop and the factory */
    function demo() {
      const s = d.o.status, el = $("#demo");
      if (s === 99 || s === 10) return;
      el.innerHTML = `<details class="demo"><summary>Demo mode (stands in for the shop and factory)</summary>
        <div class="stack" style="margin-top:12px">
          <div class="muted">Skip the steps the shop or factory would do: quote, slip check, production, QC, install date.</div>
          <div class="inline"><button class="btn ghost step">Next step</button><span class="muted">or jump to</span>
            <select class="target">${MAIN_PATH.filter((x) => x > s).map((x) => `<option value="${x}" ${x === 10 ? "selected" : ""}>${esc(STATUS_LABEL[x])}</option>`).join("")}</select>
            <button class="btn ghost jump">Jump</button></div>
          <div class="err" hidden></div></div></details>`;
      const run = async (p) => {
        const { error } = await p;
        if (error) { errBox($(".err", el), errText(error)); } else { load(); }
      };
      $(".step", el).onclick = () => run(db.rpc("demo_step", { p_order: ORDER_ID }));
      $(".jump", el).onclick = () => run(db.rpc("demo_advance_to", { p_order: ORDER_ID, p_target: Number($(".target", el).value) }));
    }
  </script>
</body>
</html>
