<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NamKheang · ร้าน</title>
  <link rel="stylesheet" href="admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Hubballi&family=Mali:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/nk-app.css">
  <link rel="stylesheet" href="../shared/login.css">
</head>
<body>
  <div id="gate" class="nk-login">
    <section class="nk-art"><a class="nk-brand" href="../">Nam<b>Kheang</b></a><div class="nk-marquee" aria-hidden="true"></div></section>
    <main class="nk-area">
      <form id="gform" class="nk-card" novalidate>
        <p class="nk-role">ร้าน · Shop / Admin</p>
        <h1>เข้าสู่ระบบร้าน</h1>
        <p class="nk-sub">จัดการคำสั่งซื้อ ใบเสนอราคา การชำระเงิน และนัดติดตั้ง</p>
        <div class="nk-field"><label for="gemail">อีเมล</label><input id="gemail" type="email" required autocomplete="username"></div>
        <div class="nk-field"><label for="gpass">รหัสผ่าน</label><input id="gpass" type="password" required autocomplete="current-password"></div>
        <div id="gerr" class="nk-err" role="alert" hidden></div>
        <button class="nk-btn">เข้าสู่ระบบ</button>
        <p class="nk-switch">เป็นโรงงาน? <a href="../factory/">เข้าสู่ระบบโรงงาน</a> · ลูกค้า <a href="../customer/index.html#/login">เข้าสู่ระบบลูกค้า</a></p>
      </form>
    </main>
  </div>
  <div id="app" class="shell" hidden>
    <aside id="side"></aside>
    <div class="col">
      <header class="topbar">
        <div class="crumbs" id="crumbs"></div>
        <div class="me"><button class="bell" id="bell" title="Pending tasks" aria-label="Pending tasks">🔔<span class="count" id="bellc" hidden></span></button><span class="avatar" id="av"></span><b id="mename"></b></div>
      </header>
      <main id="view"></main>
      <footer class="foot"><span>© 2026 NamKheang · Ice machine order management</span><span id="upd"></span></footer>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../shared/staff-lib.js"></script>
  <script src="../shared/login.js"></script>
  <script src="js/core.js"></script>
  <script src="js/lib.js"></script>
  <script>boot();</script>
</body>
</html>
