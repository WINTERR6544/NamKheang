<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00777a">
  <title>NamKheang · เข้าสู่ระบบ</title>
  <link href="https://fonts.googleapis.com/css2?family=Hubballi&family=Mali:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/login.css">
</head>
<body>
  <div class="nk-login">
    <section class="nk-art"><a class="nk-brand" href="customer/index.html#/index">Nam<b>Kheang</b></a><div class="nk-marquee" aria-hidden="true"></div></section>
    <main class="nk-area">
      <form id="pform" class="nk-card" novalidate>
        <p class="nk-role">ลูกค้า · ร้าน · โรงงาน</p>
        <h1>เข้าสู่ระบบ</h1>
        <p class="nk-sub">ใช้บัญชีเดียว ระบบจะพาไปหน้าของคุณเอง</p>
        <div class="nk-field"><label for="pemail">อีเมล</label><input id="pemail" type="email" required autocomplete="username"></div>
        <div class="nk-field"><label for="ppass">รหัสผ่าน</label><input id="ppass" type="password" required autocomplete="current-password"></div>
        <div class="nk-row">
          <label class="nk-check"><input id="premember" type="checkbox" checked> จดจำการเข้าสู่ระบบ</label>
          <a href="customer/index.html#/reset-password">ลืมรหัสผ่าน?</a>
        </div>
        <div id="perr" class="nk-err" role="alert" hidden></div>
        <button id="pbtn" class="nk-btn">เข้าสู่ระบบ</button>
        <p class="nk-switch">ลูกค้าใหม่? <a href="customer/index.html#/sign-up">สมัครสมาชิก</a> · <a href="customer/index.html#/login">เข้าด้วยเบอร์โทรศัพท์</a></p>
      </form>
      <p id="pstatus" class="nk-status" role="status" hidden>กำลังตรวจสอบการเข้าสู่ระบบ…</p>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script>
  <script src="shared/login.js"></script>
  <script src="portal.js"></script>
</body>
</html>
